<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI &amp; Math News</title>
<style>
  :root {
    --bg: #f7f7f5;
    --bg-card: #ffffff;
    --text: #1a1a1a;
    --text-muted: #5a5a5a;
    --accent: #7c3aed;
    --border: #e4e2dd;
    --link: #6d28d9;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --bg-card: #1c1c1e;
      --text: #eceae6;
      --text-muted: #a3a19c;
      --accent: #a78bfa;
      --border: #2e2e30;
      --link: #c4b5fd;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #121212;
    --bg-card: #1c1c1e;
    --text: #eceae6;
    --text-muted: #a3a19c;
    --accent: #a78bfa;
    --border: #2e2e30;
    --link: #c4b5fd;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 32px;
  }

  ul.digest-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.digest-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  li.digest-item a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.98rem;
  }

  li.digest-item a:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  li.digest-item .date {
    font-size: 0.82rem;
    color: var(--text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.35rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI &amp; Math News</h1>
  <div class="subtitle">Weekly digests of genuinely new papers, research ideas, and technical writeups in AI/ML and mathematics.</div>

  <ul class="digest-list">
    <li class="digest-item">
      <a href="digests/2026-09-17.html" target="_blank">AI &amp; Math Weekly Digest — Sep 10–17, 2026</a>
      <span class="date">2026-09-17</span>
    </li>
  </ul>

  <footer>Generated automatically, newest first.</footer>
</div>
</body>
</html>
